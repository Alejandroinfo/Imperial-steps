name: Pruebas del motor

on:
  push:
  pull_request:

jobs:
  simular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Partidas entre bots en los 12 mapas
        run: node pruebas/simular_partidas.js 2 40
